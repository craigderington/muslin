# Small local workload profile. Durability defaults remain enabled.
listen_addresses = ''
unix_socket_directories = '/run/postgresql'
unix_socket_permissions = 0700
max_connections = 10
shared_buffers = '16MB'
work_mem = '1MB'
maintenance_work_mem = '8MB'
max_wal_size = '64MB'
min_wal_size = '32MB'
max_worker_processes = 2
max_parallel_workers = 0
max_wal_senders = 0
wal_level = minimal
huge_pages = off
# Worker-based async I/O is supported without adding io_uring to the kernel.
io_method = worker
log_timezone = 'UTC'
timezone = 'UTC'
