services:
  arm64:
    build: { context: ., dockerfile: docker/Dockerfile.arm64 }
    image: muslin-builder-arm64:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes: [ "./:/muslin" ]
    stdin_open: true
    tty: true
    command: make -f Makefile.arm64 arm64

  builder:
    build: { context: ., dockerfile: docker/Dockerfile }
    image: muslin-builder:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes: [ "./:/muslin" ]
    command: make all

  qemu:
    image: muslin-builder:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes: [ "./:/muslin" ]
    network_mode: host
    environment: [ "HOST_HTTP_PORT=${HOST_HTTP_PORT:-4217}" ]
    stdin_open: true
    tty: true
    command: make run
